name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "assets/**"
      - "README.md"

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=githublight&color_snake=0891B2&color_dots=#ebedf0,#a5b4fc,#818cf8,#6366f1,#0891B2
            dist/github-snake-dark.svg?palette=githubdark&color_snake=10B981&color_dots=#2d3343,#4b5563,#7C3AED,#A78BFA,#22D3EE

      # Public on main branch so EVERY visitor sees snake without login
      - name: Copy snake into main/assets (public)
        run: |
          mkdir -p assets
          cp dist/github-snake.svg assets/github-snake.svg
          cp dist/github-snake-dark.svg assets/github-snake-dark.svg

      - name: Commit assets to main
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update public snake animation [skip ci]"
          file_pattern: assets/*.svg
          skip_dirty_check: false

      # Also keep classic output branch (guide-compatible)
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
          commit_message: "Update snake animation [skip ci]"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
